name: Build
run-name: Build FrameSize (${{ github.ref_name }})

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Compile aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -C /opt -xf /tmp/zig.tar.xz
          echo /opt/zig-x86_64-linux-0.16.0 >> "$GITHUB_PATH"

      - name: Compile
        run: |
          make host
          make aarch64
          mkdir -p dist
          cp FrameSize-aarch64 dist/FrameSize-aarch64
          sha256sum FrameSize-aarch64 | sed 's| .*|  FrameSize-aarch64|' > dist/FrameSize-aarch64.sha256
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            printf '%s\n' "$GITHUB_REF_NAME" > dist/release-tag.txt
          else
            : > dist/release-tag.txt
          fi
          echo "### FrameSize-aarch64" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist >> "$GITHUB_STEP_SUMMARY"
          cat dist/FrameSize-aarch64.sha256 >> "$GITHUB_STEP_SUMMARY"
          file dist/FrameSize-aarch64 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: FrameSize-aarch64
          path: |
            dist/FrameSize-aarch64
            dist/FrameSize-aarch64.sha256
            dist/release-tag.txt
          if-no-files-found: error
